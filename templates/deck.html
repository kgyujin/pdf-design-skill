<!doctype html>
<html lang="ko" data-style="swiss" data-palette="indigo" data-font="auto" data-density="normal" data-radius="auto">
<head>
<meta charset="utf-8">
<title>발표 자료</title>
<meta name="pdf-design:duration" content="5">
<link rel="stylesheet" href="pdf-design.css">
<style>
  /* 16:9. 슬라이드 1장 = PDF 1쪽. 쪽번호는 자동. 레이아웃·수식이 더 필요하면 talk 템플릿을 쓴다. */
  @page { size: 338.67mm 190.5mm; margin: 0; }
</style>
</head>
<body class="deck">

<section class="slide hero">
  <div class="eyebrow">프로젝트명</div>
  <div class="slide-title">한 문장으로 말하는<br>발표 제목</div>
  <p>발표자 · 날짜</p>
  <footer class="slide-foot"><span class="source">조직명</span><span class="page"></span></footer>
  <aside class="notes"><div class="talk"><p>인사와 함께 오늘 말할 결론을 한 문장으로 먼저 말한다.</p></div></aside>
</section>

<section class="slide">
  <header class="slide-head">
    <div class="eyebrow">문제</div>
    <div class="slide-title">슬라이드 제목은 결론 문장으로 쓴다</div>
  </header>
  <div class="slide-body">
    <div class="grid-3 center">
      <div class="card soft"><h3>원인 1</h3><p>한두 줄 설명</p></div>
      <div class="card soft"><h3>원인 2</h3><p>한두 줄 설명</p></div>
      <div class="card hl"><h3>원인 3</h3><p>강조할 카드는 hl</p></div>
    </div>
  </div>
  <footer class="slide-foot"><span class="source">출처: 자료명, 기준일</span><span class="page"></span></footer>
  <aside class="notes"><div class="talk"><p>세 가지 원인 중 가장 중요한 것은 세 번째입니다.</p></div></aside>
</section>

<section class="slide">
  <header class="slide-head">
    <div class="eyebrow">결과</div>
    <div class="slide-title">숫자 하나가 슬라이드를 끌고 간다</div>
  </header>
  <div class="slide-body">
    <div class="compare center">
      <div class="card soft"><div class="eyebrow">이전</div><div class="big-number muted">000</div><p>측정 조건</p></div>
      <div class="card"><div class="eyebrow">이후</div><div class="big-number">000</div><p>측정 조건</p></div>
    </div>
  </div>
  <footer class="slide-foot"><span class="source">출처: 자료명, 기준일</span><span class="page"></span></footer>
  <aside class="notes"><div class="talk"><p>같은 조건에서 측정한 이전과 이후 값입니다.</p></div></aside>
</section>

</body>
</html>
