<!doctype html>
<html lang="ko" data-style="swiss" data-palette="graphite" data-font="auto" data-density="normal" data-radius="auto">
<head>
<meta charset="utf-8">
<title>발표 자료</title>
<link rel="stylesheet" href="pdf-design.css">
<style>
  /* 16:9. 슬라이드 1장 = PDF 1쪽. 쪽번호는 자동. 레이아웃·수식이 더 필요하면 talk 템플릿을 쓴다. */
  @page { size: 338.67mm 190.5mm; margin: 0; }
</style>
</head>
<body class="deck">

<section class="slide hero">
  <div class="eyebrow">프로젝트명</div>
  <div class="slide-title">한 문장으로 말하는<br>발표 제목</div>
  <p>발표자 · 날짜</p>
  <footer class="slide-foot"><span class="page"></span></footer>

</section>

<section class="slide">
  <header class="slide-head">
    <div class="slide-title">슬라이드 제목은 결론 문장으로 쓴다</div>
  </header>
  <div class="slide-body l-points">
    <ol class="points">
      <li><strong>가장 중요한 원인</strong>근거가 되는 사실 한 줄</li>
      <li><strong>두 번째 원인</strong>근거가 되는 사실 한 줄</li>
      <li><strong>세 번째 원인</strong>근거가 되는 사실 한 줄</li>
    </ol>
  </div>
  <footer class="slide-foot"><span class="page"></span></footer>

</section>

<section class="slide">
  <header class="slide-head">
    <div class="slide-title">숫자 하나가 슬라이드를 끌고 간다</div>
  </header>
  <div class="slide-body">
    <div class="compare center">
      <div><p class="muted">이전</p><div class="big-number muted">000</div><p>측정 조건</p></div>
      <div><p class="muted">이후</p><div class="big-number">000</div><p>측정 조건</p></div>
    </div>
  </div>
  <footer class="slide-foot"><span class="page"></span></footer>

</section>

</body>
</html>
