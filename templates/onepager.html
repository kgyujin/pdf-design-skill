<!doctype html>
<html lang="ko" data-style="swiss" data-palette="indigo" data-font="auto" data-density="normal" data-radius="auto">
<head>
<meta charset="utf-8">
<title>원페이저</title>
<link rel="stylesheet" href="pdf-kit.css">
<style>
  /* A4 한 장 고정. 넘치면 render --expect-pages 1 이 실패하거나 내용이 잘린다. */
  @page { size: A4; margin: 0; }
</style>
</head>
<body>
<div class="sheet">
  <aside class="side">
    <p class="name">이름</p>
    <p class="role">직무 / 한 줄 포지셔닝</p>

    <h3>Contact</h3>
    <ul>
      <li>email@example.com</li>
      <li>github.com/username</li>
    </ul>

    <h3>Skills</h3>
    <div><span class="tag">기술 1</span><span class="tag">기술 2</span><span class="tag">기술 3</span></div>

    <h3>Education</h3>
    <p><strong>학교명</strong><br>전공 · 입학–졸업</p>
  </aside>

  <main class="main-col">
    <h2>요약</h2>
    <p>무엇을 잘하고, 어떤 결과를 냈는지 2~3문장으로 쓴다.</p>

    <h2>경험</h2>
    <div class="entry">
      <div class="entry-head"><span class="entry-title">프로젝트 / 회사명</span><span class="entry-date">YYYY.MM – YYYY.MM</span></div>
      <div class="entry-sub">역할 · 기술 스택</div>
      <ul>
        <li><strong>문제</strong>를 <strong>행동</strong>으로 해결해 <strong>수치 결과</strong>를 냈다.</li>
        <li>한 항목은 두 줄을 넘기지 않는다.</li>
      </ul>
    </div>
  </main>
</div>
</body>
</html>
